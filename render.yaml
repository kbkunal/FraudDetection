services:
  - type: web
    name: cybershield-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cybershield-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://your-frontend.vercel.app

databases:
  - name: cybershield-db
    databaseName: cybershield
    user: cybershield
    plan: free
